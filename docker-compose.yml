# Local system under test for the example suite: Swagger Petstore v3 (OpenAPI 3.0).
#   docker compose up -d petstore     -> http://localhost:8080/api/v3
#   OpenAPI document                  -> http://localhost:8080/api/v3/openapi.json
# CI and every write test use this container; the public instance is for reads/drift only.
# PETSTORE_PORT moves the host port when 8080 is taken (point QA_PETSTORE_BASE_URL and
# QA_PETSTORE_SPEC_URL at it).
# Pinned by tag and digest so a new upstream image, or the same tag pushed again, cannot silently
# change the contract under test (PET-04).
#
# Second pack: VAmPI (OpenAPI 3.0), the same image run in its two modes.
#   docker compose up -d vampi-secure vampi-vulnerable
#   vampi-secure      (vulnerable=0)  -> http://localhost:5001
#   vampi-vulnerable  (vulnerable=1)  -> http://localhost:5002
# The image only publishes `latest`, so it is pinned by digest (upstream commit f16052d).
# tokentimetolive is the JWT lifetime in seconds. Ports are bound to 127.0.0.1: the vulnerable
# mode is deliberately insecure and must not be reachable from the network.
# VAMPI_SECURE_PORT and VAMPI_VULNERABLE_PORT move the host ports when 5001 or 5002 are taken
# (point QA_VAMPI_BASE_URL and QA_VAMPI_SPEC_URL at the moved port of the mode you run).
#
# DAST lane: OWASP ZAP's API scan, run by `npm run lanes:dast -- --service <pack>`.
#   docker compose run --rm zap zap-api-scan.py ...   (the lane builds the command)
# It sits in the `dast` profile, so `docker compose up` never starts it. ZAP runs in the
# project network: the lane points it at the compose service that publishes a localhost port,
# else at host.docker.internal (extra_hosts maps it on Linux too). Reports and the fetched
# definition live in reports/dast (ZAP's /zap/wrk); services/ is mounted read-only, for each
# pack's rule policy (services/<pack>/dast-rules.tsv). Pinned by tag and digest: the
# 2026-08-07 build, which ships ZAP 2.17.0.
#
# Performance lane: k6, run by `npm run lanes:perf -- --service <pack>`.
#   docker compose run --rm k6 run ... /k6/smoke.js   (the lane builds the command)
# It sits in the `perf` profile and reaches the API the same way as ZAP. The lane writes the plan
# and k6 writes its summary in reports/perf (/perf); the k6 script is mounted read-only from
# scripts/k6. Pinned by tag and digest: k6 v1.8.0.
#
# Differential lane: an earlier Petstore release as the reference, compared with the pinned one by
# `npm run lanes:diff -- --service petstore --reference reference`.
#   docker compose --profile diff up -d --wait petstore-reference   -> http://localhost:8081/api/v3
# 1.0.26 is the newest release whose behaviour differs from 1.0.28 (1.0.27 answers the same); it
# sits in the `diff` profile, is bound to 127.0.0.1 and is pinned by tag and digest.
# PETSTORE_REFERENCE_PORT moves its host port when 8081 is taken.
#
# Third pack: the Keycloak Admin REST API (OpenAPI 3.0), whose token endpoint is the same server's
# (FUT-15).
#   npm run keycloak:up   -> http://localhost:8180 (admin API under /admin/realms/qa)
# Development mode, in-memory: stopping the container discards every write. At start it imports
# services/keycloak/realm/qa-realm.json, the `qa` realm with three service-account clients, and
# fills its ${...} placeholders from the container's environment: the client secrets are passed
# through from the host (KEYCLOAK_*_CLIENT_SECRET) and never written in a file. Bound to 127.0.0.1;
# KEYCLOAK_PORT moves the host port when 8180 is taken. Pinned by tag and digest: 26.7.5.
x-vampi: &vampi
  image: erev0s/vampi@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
  healthcheck:
    test:
      [
        'CMD',
        'python',
        '-c',
        "from http.client import HTTPConnection as H; c = H('127.0.0.1', 5000, timeout=2); c.request('GET', '/'); assert c.getresponse().status == 200",
      ]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  petstore:
    image: swaggerapi/petstore3:1.0.28@sha256:dc991f49b62fed5ece2816a1b22aeeeb49278cdf56fb87dc9d69e30541d6cd6d
    ports:
      - '${PETSTORE_PORT:-8080}:8080'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:8080/api/v3/openapi.json >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
  petstore-reference:
    image: swaggerapi/petstore3:1.0.26@sha256:56d5a33330135ea6875e8d10ea4ba2008eba62af99467fe0ef4fba6d97e83b48
    profiles: [diff]
    ports:
      - '127.0.0.1:${PETSTORE_REFERENCE_PORT:-8081}:8080'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:8080/api/v3/openapi.json >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
  vampi-secure:
    <<: *vampi
    environment:
      vulnerable: '0'
      tokentimetolive: '60'
    ports:
      - '127.0.0.1:${VAMPI_SECURE_PORT:-5001}:5000'
  vampi-vulnerable:
    <<: *vampi
    environment:
      vulnerable: '1'
      tokentimetolive: '60'
    ports:
      - '127.0.0.1:${VAMPI_VULNERABLE_PORT:-5002}:5000'
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    command: ['start-dev', '--import-realm']
    environment:
      # The tokens' issuer is the published URL whatever host a request names, so a token issued
      # on localhost is honoured when a lane's container calls `keycloak:8080` (GATE-29).
      KC_HOSTNAME: 'http://localhost:${KEYCLOAK_PORT:-8180}'
      KC_HEALTH_ENABLED: 'true'
      KC_DB: dev-mem
      KEYCLOAK_ADMIN_CLIENT_ID:
      KEYCLOAK_ADMIN_CLIENT_SECRET:
      KEYCLOAK_VIEWER_CLIENT_ID:
      KEYCLOAK_VIEWER_CLIENT_SECRET:
      KEYCLOAK_NO_ROLE_CLIENT_ID:
      KEYCLOAK_NO_ROLE_CLIENT_SECRET:
    volumes:
      - ./services/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8180}:8080'
    healthcheck:
      # The image has no curl or wget: bash asks the management port's readiness endpoint.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
  zap:
    image: zaproxy/zap-stable:20260807@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    profiles: [dast]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./reports/dast:/zap/wrk:rw
      - ./services:/zap/services:ro
  k6:
    image: grafana/k6:1.8.0@sha256:b992f241070f3f3a7d78096fa6020db1edcda49297ee8ed9eb0ab847ef3dcb32
    profiles: [perf]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./reports/perf:/perf:rw
      - ./scripts/k6:/k6:ro
