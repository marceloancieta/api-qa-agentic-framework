# Local system under test for the example suite: Swagger Petstore v3 (OpenAPI 3.0).
#   docker compose up -d petstore     -> http://localhost:8080/api/v3
#   OpenAPI document                  -> http://localhost:8080/api/v3/openapi.json
# CI and every write test use this container; the public instance is for reads/drift only.
# PETSTORE_PORT moves the host port when 8080 is taken (point API_BASE_URL and API_SPEC_URL at it).
# The tag is pinned so a new upstream image cannot silently change the contract under test.
services:
  petstore:
    image: swaggerapi/petstore3:1.0.28
    ports:
      - '${PETSTORE_PORT:-8080}:8080'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:8080/api/v3/openapi.json >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
