# Dependabot version updates (backlog CI-02). docs/ci-security.md explains the choices.
#
# Commit messages: Dependabot can only add a fixed prefix, so its commits read
# `build(deps): Bump x from 1.0.0 to 1.1.0` (npm) and `ci(deps): Bump actions/x ...` (actions). That
# is Conventional Commits, but it carries no backlog id: a fixed id would tie every bump to one item.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    # Wait two weeks before proposing a release, the same rule as for pinned actions. Security
    # updates are not delayed.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The type definitions follow the Node major in .nvmrc; a new major comes with a runtime change.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
