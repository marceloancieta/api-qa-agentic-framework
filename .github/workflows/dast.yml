# DAST (FUT-01): an OWASP ZAP API scan of the VAmPI pack in both modes and of the Petstore pack,
# weekly, on demand and on pull requests that change the lane or a pack's policy. A full scan takes
# minutes, so it does not run on every pull request. The VAmPI secure mode is scanned with the
# pack's credential (FUT-10) and feeds the quality gate's `dast` check; the vulnerable mode, scanned
# without one (VN-15), must be caught by a FAIL rule (SQL injection, VN-11). The Petstore scan
# covers a base URL with a path, an API key in a header, one scan thread (PN-26) and the restart
# after the scan's writes. What each step runs: docs/ci.md.
name: dast

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/dast-lane.mjs'
      - 'scripts/quality-gate.mjs'
      - 'scripts/destructive-lane.mjs'
      - 'scripts/known-gap-lane.mjs'
      - 'scripts/config-check.mjs'
      - 'scripts/lib/**'
      - 'services/*/dast-*'
      - 'services/*/service.json'
      - 'services/vampi/register-users.mjs'
      - 'qa-config.example.json'
      - 'docker-compose.yml'
      - '.github/workflows/dast.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: dast (vampi ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [secure, vulnerable]
    env:
      COMPOSE_PROJECT_NAME: qa-dast-${{ matrix.mode }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both modes start, so the compose services publish the ports qa-config names; the lane
      # reaches the one of this mode over the project network.
      - name: Start VAmPI
        timeout-minutes: 5
        run: npm run vampi:up

      # The secure mode is scanned with the pack's credential (FUT-10): throwaway users per run,
      # registered by the pack, as in the e2e-vampi job.
      - name: Provide and register the VAmPI users
        if: ${{ matrix.mode == 'secure' }}
        env:
          QA_ENV: local
        run: |
          for actor in A B; do
            name="qa-$(echo "$actor" | tr 'AB' 'ab')-$(openssl rand -hex 6)"
            password="$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            echo "VAMPI_USER_${actor}_NAME=$name" >> "$GITHUB_ENV"
            echo "VAMPI_USER_${actor}_PASSWORD=$password" >> "$GITHUB_ENV"
            export "VAMPI_USER_${actor}_NAME=$name" "VAMPI_USER_${actor}_PASSWORD=$password"
          done
          npm run vampi:users

      # The secure mode must pass the quality gate on its own scan.
      - name: Scan the secure mode, then the quality gate
        if: ${{ matrix.mode == 'secure' }}
        env:
          QA_ENV: local
        run: |
          npm run lanes:dast -- --service vampi
          npm run quality:gate
          cat reports/quality-gate.md >> "$GITHUB_STEP_SUMMARY"

      # The vulnerable mode must fail on a FAIL rule (exit 1), with SQL injection (rule 40018) in the
      # report; any other outcome means the scan stopped detecting what it exists to detect. It scans
      # without a token: with one, ZAP reaches the e-mail update's Regex DoS and the API stops
      # answering (VN-15).
      - name: Scan the vulnerable mode and require the SQL injection finding
        if: ${{ matrix.mode == 'vulnerable' }}
        env:
          QA_ENV: local-vulnerable
        run: |
          set +e
          npm run lanes:dast -- --service vampi --out vampi-vulnerable --actor anonymous
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected the lane to exit 1 (an alert of a FAIL rule); it exited $code."
            exit 1
          fi
          node -e "
            const r = require('./reports/dast/vampi-vulnerable.json');
            const sites = Array.isArray(r.site) ? r.site : [r.site];
            const found = sites.some((s) => (s.alerts ?? []).some((a) => a.pluginid === '40018'));
            if (!found) { console.error('No SQL Injection (40018) alert in the report.'); process.exit(1); }
            console.log('SQL injection detected on the vulnerable mode (VN-11).');
          "

      - name: VAmPI logs
        if: ${{ failure() }}
        run: |
          mkdir -p reports
          docker compose logs --no-color vampi-secure vampi-vulnerable > reports/vampi.log 2>&1 || echo "no VAmPI logs"

      - name: Upload reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-${{ matrix.mode }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop VAmPI
        if: ${{ always() }}
        run: npm run vampi:down

  scan-petstore:
    name: dast (petstore)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Own compose project, so the lane's recovery (`docker compose restart petstore`) restarts
      # only this run's container.
      COMPOSE_PROJECT_NAME: qa-dast-petstore
      QA_ENV: local
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The variable named by qa-config api.environments.local.packs.petstore.auth.env; the
      # Petstore accepts any non-empty value (PN-05), so one is generated per run.
      - name: Provide API_KEY
        run: |
          key="$(openssl rand -hex 12)"
          echo "::add-mask::$key"
          echo "API_KEY=$key" >> "$GITHUB_ENV"

      - name: Start the Petstore
        timeout-minutes: 5
        run: npm run petstore:up

      # The scan writes, so the lane restarts the Petstore afterwards (the pack's recovery) and
      # fails if it does not answer again. Every alert is a warning: the pack has no rule policy.
      - name: Scan the Petstore
        run: npm run lanes:dast -- --service petstore

      - name: Petstore logs
        if: ${{ failure() }}
        run: |
          mkdir -p reports
          docker compose logs --no-color petstore > reports/petstore.log 2>&1 || echo "no Petstore logs"

      - name: Upload reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-petstore-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the Petstore
        if: ${{ always() }}
        run: npm run petstore:down
