# CodeQL static analysis of the JavaScript and TypeScript code (backlog CI-02).
# Alerts go to the repository's code scanning page; docs/ci-security.md explains how to enable or
# remove it. Do not combine with CodeQL "default setup" in the repository settings: GitHub rejects
# the uploads of one of the two.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1' # Monday 05:23 UTC, catches new queries on unchanged code
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results
      actions: read # read the run's metadata; needed in private repositories
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          # Linter fixtures contain defective code on purpose; they are input, not product code.
          # AlertSuppression turns a `// codeql[<rule id>]` comment on the line above a result into a
          # suppression, so an accepted finding is explained next to the code (GATE-20). No pack
          # version: the query comes from the bundle that runs the analysis.
          config: |
            paths-ignore:
              - scripts/__fixtures__
            packs:
              - codeql/javascript-queries:AlertSuppression.ql

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
