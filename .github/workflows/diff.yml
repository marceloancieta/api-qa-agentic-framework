# Differential lane (FUT-06): the pinned Petstore compared with an earlier release, request by
# request and contract by contract, weekly, on demand and on pull requests that change the lane, the
# comparison it shares with the specs, its plan or a pack's differential file. The job passes when
# every difference is one the pack accepted (PN-29) and each of them still shows up. What each step
# runs: docs/ci.md.
name: diff

on:
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diff-lane.mjs'
      - 'scripts/perf-lane.mjs'
      - 'scripts/swagger-digest.mjs'
      - 'scripts/quality-gate.mjs'
      - 'scripts/config-check.mjs'
      - 'scripts/lib/**'
      - 'services/*/diff.json'
      - 'services/*/perf.json'
      - 'services/*/openapi.*'
      - 'services/*/service.json'
      - 'qa-config.example.json'
      - 'docker-compose.yml'
      - '.github/workflows/diff.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  petstore:
    name: diff (petstore)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: qa-diff-petstore
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The variable named by the pack's `auth` in both environments; the Petstore accepts any
      # non-empty value (PN-05), so one is generated per run.
      - name: Provide API_KEY
        run: |
          key="$(openssl rand -hex 12)"
          echo "::add-mask::$key"
          echo "API_KEY=$key" >> "$GITHUB_ENV"

      - name: Start the candidate and the reference
        timeout-minutes: 5
        run: |
          npm run petstore:up
          npm run petstore:reference:up

      # The candidate is the `local` environment (the pinned image), the reference the
      # `reference` environment (the earlier release) of qa-config.example.json.
      - name: Compare the releases
        env:
          QA_ENV: local
        run: npm run lanes:diff -- --service petstore --reference reference

      - name: Upload the report
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-petstore-${{ github.run_attempt }}
          path: reports/diff/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the Petstores
        if: ${{ always() }}
        run: |
          npm run petstore:reference:down
          npm run petstore:down
