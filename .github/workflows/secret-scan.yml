# gitleaks over the full git history (backlog CI-02). It runs the same command as
# `npm run scan:secrets` (scripts/secret-scan.mjs --history), with a gitleaks binary taken from its
# GitHub release and checked against a pinned SHA-256. Findings are redacted, and any finding fails
# the job. docs/ci-security.md explains why the binary is used instead of gitleaks/gitleaks-action
# and how to update the version.
#
# The private denylist scan (scripts/scan-denylist.mjs) reads `.git/info/denylist`, which exists only
# on the maintainer's machine, so it cannot run here; its self-test runs in `npm run gates`.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Update both together. The checksum is the line for the linux_x64 archive in
  # gitleaks_<version>_checksums.txt of the same release.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $dir/$archive" | sha256sum --check --strict
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan every commit
        run: |
          gitleaks version
          node scripts/secret-scan.mjs --history
