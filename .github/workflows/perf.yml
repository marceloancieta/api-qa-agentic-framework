# Performance smoke (FUT-02): the k6 lane against each pack's local container, weekly, on demand and
# on pull requests that change the lane, its k6 script, a pack's performance file or the quality
# gate. The Petstore run feeds the quality gate's `p95_latency` check; the VAmPI run proves the lane
# on a second contract. What each step runs: docs/ci.md.
name: perf

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/perf-lane.mjs'
      - 'scripts/k6/**'
      - 'scripts/lib/container.mjs'
      - 'scripts/quality-gate.mjs'
      - 'services/*/perf.json'
      - 'docker-compose.yml'
      - '.github/workflows/perf.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: perf (${{ matrix.pack }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pack: [petstore, vampi]
    env:
      COMPOSE_PROJECT_NAME: qa-perf-${{ matrix.pack }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the API
        timeout-minutes: 5
        run: npm run ${{ matrix.pack }}:up

      # The lane fails on a request that does not answer its expected status; latency is judged by
      # the quality gate, which reads the Petstore summary (qa-config.example.json).
      - name: Run the performance lane
        run: npm run lanes:perf -- --service ${{ matrix.pack }}

      - name: Quality gate
        if: ${{ matrix.pack == 'petstore' }}
        run: |
          npm run quality:gate
          cat reports/quality-gate.md >> "$GITHUB_STEP_SUMMARY"

      - name: API logs
        if: ${{ failure() }}
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/${{ matrix.pack }}.log 2>&1 || echo "no API logs"

      - name: Upload reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-${{ matrix.pack }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the API
        if: ${{ always() }}
        run: npm run ${{ matrix.pack }}:down
