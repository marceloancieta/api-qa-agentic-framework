# CI (CI-01): the gates, then the end-to-end run of each pack; the Petstore's is reported as one run.
# What each step runs, in which order and why: docs/ci.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# An explicit bash shell runs with `-eo pipefail`, so a failing command fails its step.
defaults:
  run:
    shell: bash

jobs:
  # main takes squash merges, so a pull request's title becomes the commit subject on main: it has
  # to follow ADR 0008. Dependabot cannot add a backlog id, so its pull requests are skipped (a
  # skipped job satisfies a required check). The title reaches the script through the environment,
  # never through the command line, so no title can inject shell code.
  title:
    name: title
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Pull-request title follows the commit convention
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/commit-title.mjs "$PR_TITLE"

  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # lint-docs checks each closing commit of the backlog against the history (GATE-15).
          fetch-depth: 0

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Needs no API and no binary beyond git and Node (gitleaks runs only in the git hooks).
      - name: Gates
        run: npm run gates

  e2e:
    name: e2e (petstore)
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Own compose project, so `petstore:down` and the recovery restart touch only this run's container.
      COMPOSE_PROJECT_NAME: qa-ci
      # One run id from execution to the test-management tool (L-48), traceable to this workflow run.
      QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      # Allure TestOps receives the run when the repository holds its secrets; otherwise the tool in
      # qa-config does (docs/ci.md#reporting-to-allure-testops). Pull requests from forks get no
      # secrets, so they fall back too.
      QA_TM_PROVIDER: ${{ secrets.ALLURE_TOKEN != '' && 'allure-testops' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The variable named by qa-config api.environments.local.packs.petstore.auth.env. A real API
      # takes it from the API_KEY secret; the Petstore accepts any non-empty value, so without the
      # secret one is generated per run.
      - name: Provide API_KEY
        env:
          PROVIDED_API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$PROVIDED_API_KEY" ]; then
            key="$PROVIDED_API_KEY"
          else
            key="$(openssl rand -hex 12)"
          fi
          echo "::add-mask::$key"
          echo "API_KEY=$key" >> "$GITHUB_ENV"

      # docker compose rather than a service container: the destructive lane's recovery is
      # `docker compose restart petstore` (qa-config
      # api.environments.local.packs.petstore.recovery).
      - name: Start the Petstore
        id: petstore
        timeout-minutes: 5
        run: npm run petstore:up

      # Only the pack whose service this job starts; its preflight project runs first and, when it
      # fails, none of its cases runs. Other packs need their own services in the job.
      - name: Suite (preflight, then api)
        id: suite
        run: npx playwright test --project=api-petstore

      # Last, and only after the shared run: each @destructive case alone, then the recovery.
      # Its results join the run above (same run id), so the report below covers both.
      - name: Destructive lane
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: npm run lanes:destructive -- --service petstore

      # The `local` tool keeps its definitions in reports/tm/local, which is not tracked, so a fresh
      # runner starts empty: rebuild them from the registries before reporting. Only for `local`: a
      # real definitions-first tool is published by qa-publish after its review gate, never by CI.
      - name: Rebuild the local tool's definitions
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: |
          provider=$(node -p "require('./qa-config.example.json').test_management.provider")
          if [ -z "$QA_TM_PROVIDER" ] && [ ! -f qa-config.json ] && [ "$provider" = local ]; then
            npm run tm:publish -- --service petstore
          else
            echo "test_management.provider is not the example's local store; nothing to rebuild."
          fi

      # The TestOps credentials reach this step only.
      - name: Report the run to test management
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        env:
          # Endpoint and project id are not secret: as variables they stay readable in the log (a
          # secret is masked everywhere it appears, and a project id like 1 would hide every 1).
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: npm run tm:report -- --service petstore

      # The gates ran this without results; now it also checks every published case has a result
      # in this run and that no blocked case passed.
      - name: Coverage status against the run
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: npm run coverage:status

      - name: Quality gate
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: npm run quality:gate

      - name: Quality gate summary
        if: ${{ !cancelled() && hashFiles('reports/quality-gate.md') != '' }}
        run: cat reports/quality-gate.md >> "$GITHUB_STEP_SUMMARY"

      # One index.html that opens from disk (allurerc.mjs); it travels in the reports artifact.
      - name: Allure report
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: npm run report:html

      - name: Petstore logs
        if: ${{ failure() }}
        run: |
          mkdir -p reports
          docker compose logs --no-color petstore > reports/petstore.log 2>&1 || echo "no Petstore logs"

      # Skipped under act (it sets ACT), whose artifact server lacks the upload-artifact v7 protocol.
      - name: Upload reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports-${{ github.run_attempt }}
          path: |
            allure-results/
            playwright-report/
            reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the Petstore
        if: ${{ always() }}
        run: npm run petstore:down

  # The second pack (CI-08), in a job of its own so the required `e2e (petstore)` check keeps its
  # meaning. Both VAmPI modes run from one pinned image: the vulnerable mode first, to prove the
  # authorization matrix still detects its flaw, then the secure mode, whose results feed the
  # coverage, the quality gate and the report.
  e2e-vampi:
    name: e2e (vampi)
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: qa-ci-vampi
      QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-vampi
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The users behind actors user-a and user-b (qa-config, `login` auth). The pack registers them
      # on a fresh container, so throwaway values per run are enough; they are masked in the log.
      - name: Provide the VAmPI users
        run: |
          for actor in A B; do
            name="qa-$(echo "$actor" | tr 'AB' 'ab')-$(openssl rand -hex 6)"
            password="$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            echo "VAMPI_USER_${actor}_NAME=$name" >> "$GITHUB_ENV"
            echo "VAMPI_USER_${actor}_PASSWORD=$password" >> "$GITHUB_ENV"
          done

      - name: Start VAmPI (both modes)
        timeout-minutes: 5
        run: npm run vampi:up

      # Exactly TC-BOOK-02 must fail on the vulnerable mode (VN-09); anything else fails the step.
      - name: BOLA detection on the vulnerable mode
        env:
          QA_ENV: local-vulnerable
          QA_JSON_REPORT: reports/vampi-vulnerable.json
        run: |
          npx playwright test --project=api-vampi services/vampi/specs/books-authorization.spec.ts || true
          node services/vampi/check-bola-detection.mjs reports/vampi-vulnerable.json

      - name: Suite on the secure mode (preflight, then api)
        id: suite
        if: ${{ !cancelled() }}
        run: npx playwright test --project=api-vampi

      - name: Coverage status against the run
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: npm run coverage:status

      - name: Quality gate
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: npm run quality:gate

      - name: Quality gate summary
        if: ${{ !cancelled() && hashFiles('reports/quality-gate.md') != '' }}
        run: cat reports/quality-gate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Allure report
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: npm run report:html

      - name: VAmPI logs
        if: ${{ failure() }}
        run: |
          mkdir -p reports
          docker compose logs --no-color vampi-secure vampi-vulnerable > reports/vampi.log 2>&1 || echo "no VAmPI logs"

      - name: Upload reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-vampi-reports-${{ github.run_attempt }}
          path: |
            allure-results/
            playwright-report/
            reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop VAmPI
        if: ${{ always() }}
        run: npm run vampi:down

  # The third pack (FUT-15): the Keycloak Admin REST API, whose `oauth2_client_credentials` auth
  # gets its tokens from the same server's token endpoint. Not a required check.
  e2e-keycloak:
    name: e2e (keycloak)
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: qa-ci-keycloak
      QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-keycloak
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The service-account clients of the realm (qa-config `actors`). `keycloak:up` imports them
      # with these secrets, so throwaway values per run are enough; they are masked in the log.
      - name: Provide the Keycloak clients
        run: |
          for client in ADMIN VIEWER NO_ROLE; do
            secret="$(openssl rand -hex 16)"
            echo "::add-mask::$secret"
            echo "KEYCLOAK_${client}_CLIENT_ID=qa-$(echo "$client" | tr 'A-Z_' 'a-z-')" >> "$GITHUB_ENV"
            echo "KEYCLOAK_${client}_CLIENT_SECRET=$secret" >> "$GITHUB_ENV"
          done

      - name: Start Keycloak
        timeout-minutes: 5
        run: npm run keycloak:up

      - name: Suite (preflight, then api)
        run: npx playwright test --project=api-keycloak

      - name: Keycloak logs
        if: ${{ failure() }}
        run: |
          mkdir -p reports
          docker compose logs --no-color keycloak > reports/keycloak.log 2>&1 || echo "no Keycloak logs"

      - name: Upload reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-keycloak-reports-${{ github.run_attempt }}
          path: |
            allure-results/
            playwright-report/
            reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Keycloak
        if: ${{ always() }}
        run: npm run keycloak:down
